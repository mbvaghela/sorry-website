<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff8fb1">
<title>Sorry, Dr. Ma'am 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#ff2d75; --rose2:#ff5c93; --pink:#ffc2d4; --blush:#ffe5ec; --plum:#7a1740; --ink:#3a2a2a;
  --glass:rgba(255,255,255,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--plum);background:#ffd6e2}
button{font-family:inherit;border:0;cursor:pointer;color:#fff;font-weight:700;border-radius:999px;transition:transform .2s,filter .2s,box-shadow .2s;touch-action:manipulation}
button:active{transform:scale(.95)}
.script{font-family:'Dancing Script',cursive}

/* ===== animated pastel background (mobile first) ===== */
.bg{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(60% 40% at 15% 10%,#ff9db8 0,transparent 70%),
  radial-gradient(55% 40% at 90% 20%,#ffd1e3 0,transparent 70%),
  radial-gradient(60% 45% at 80% 95%,#ffb4cc 0,transparent 70%),
  radial-gradient(50% 40% at 5% 90%,#e9c7ff 0,transparent 70%),
  linear-gradient(160deg,#ffe0ea,#fff0f4)}
.blob{position:fixed;z-index:-1;border-radius:50%;filter:blur(40px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.blob.a{width:220px;height:220px;background:#ff7aa5;top:-60px;left:-60px}
.blob.b{width:260px;height:260px;background:#d9b3ff;bottom:-80px;right:-80px;animation-delay:-5s}
@keyframes drift{to{transform:translate(40px,60px) scale(1.2)}}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
  padding:max(58px,calc(env(safe-area-inset-top) + 50px)) 16px max(18px,env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.screen::before,.screen::after{content:'';flex:1 0 8px}
.screen>*{flex-shrink:0}   /* stops elements being squashed on small phones, lets the page scroll instead */
.screen.active{display:flex;animation:fadeIn .7s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1.5px solid rgba(255,255,255,.75);
  box-shadow:0 10px 30px rgba(255,45,117,.16)}

/* ===== floating hearts / rain / confetti ===== */
.floaty{position:fixed;bottom:-30px;pointer-events:none;z-index:1;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) translateX(26px) rotate(20deg);opacity:0}}
.rain,.confetti{position:fixed;top:-40px;pointer-events:none;z-index:90;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(118vh) rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b1020e6;color:#fff;
  padding:11px 20px;border-radius:14px;font-size:14px;z-index:300;max-width:88vw;text-align:center;animation:fadeIn .3s}
#wipe{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#ffb3c8,#fff0f4);opacity:0;pointer-events:none;transition:opacity .8s}
#wipe.show{opacity:1;pointer-events:all}

/* ===== characters ("gif" stickers) ===== */
.char{width:100%;height:100%;overflow:visible;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.tear{animation:tear 1.7s ease-in infinite;opacity:0}
.tear.t2{animation-delay:.8s}
@keyframes tear{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(26px);opacity:0}}
.ear{animation:ear 2.6s ease-in-out infinite;transform-origin:50% 60%}
@keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-2deg)}}

/* ===== S0 intro ===== */
#s0{justify-content:center;text-align:center;background:linear-gradient(170deg,#3a0f2b,#7a1740 55%,#ff5c93);color:#fff;z-index:60}
#s0 .env{font-size:84px;animation:envb 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 20px #ff2d7580)}
@keyframes envb{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
#s0 h1{font-size:clamp(38px,12vw,56px);line-height:1.05;margin:14px 0 8px;text-shadow:0 4px 18px #0006}
#s0 p{font-size:15px;opacity:.9;margin-bottom:26px}
.b-open{background:linear-gradient(90deg,#ff2d75,#ff7aa5);padding:16px 40px;font-size:18px;box-shadow:0 10px 26px #ff2d7599;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ===== S1 landing ===== */
.pill{font-size:12px;font-weight:600;letter-spacing:.5px;padding:6px 14px;border-radius:999px;margin-bottom:10px}
#s1 h1{font-size:clamp(32px,10vw,50px);line-height:1.05;text-align:center;color:#e0115f;text-shadow:0 3px 0 #fff,0 8px 24px #ff2d7540}
.beat{font-size:32px;margin:6px 0 10px;animation:beat 1.1s infinite;display:inline-block}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.28)}30%{transform:scale(1)}45%{transform:scale(1.2)}}
.msg{width:100%;max-width:440px;border-radius:20px;padding:14px 18px;text-align:center;font-family:'Dancing Script',cursive;
  font-size:clamp(19px,5.4vw,24px);font-weight:600;color:#b0124a;line-height:1.35;margin-bottom:16px}
.cards{width:100%;max-width:440px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}
.card{border-radius:18px;padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px}
.card:nth-child(1){animation:floatc 3.4s ease-in-out infinite}
.card:nth-child(2){animation:floatc 3.4s ease-in-out -1.1s infinite}
.card:nth-child(3){animation:floatc 3.4s ease-in-out -2.2s infinite}
@keyframes floatc{50%{transform:translateY(-6px)}}
.card .art{width:100%;height:88px}
.card p{font-family:'Dancing Script',cursive;font-weight:700;font-size:13.5px;line-height:1.15;color:#b0124a;text-align:center}
.btns{display:flex;gap:12px;width:100%;max-width:440px;justify-content:center;align-items:center}
.b-yes{background:linear-gradient(90deg,#ff1a82,#e0002a);padding:15px 18px;font-size:15px;box-shadow:0 8px 20px #ff1a8266;flex:1;transition:transform .3s}
.b-no{background:linear-gradient(90deg,#2f9bff,#8b2cf5);padding:15px 18px;font-size:15px;box-shadow:0 8px 20px #6a3df555;flex:1}
.foot{margin-top:16px;font-size:12px;color:#8a1040;opacity:.8;text-align:center}

/* ===== S2 memory lane ===== */
#s2 h2{font-size:clamp(24px,7.4vw,38px);line-height:1.1;color:#e0115f;text-align:center;text-shadow:0 3px 0 #fff}
#s2 .sub{margin:8px 0 14px;text-align:center;font-size:13.5px;color:#7a4a5e;line-height:1.5;max-width:380px}
.slider{position:relative;width:min(92vw,420px,calc(var(--vh,1vh)*46*1.25));aspect-ratio:5/4;border-radius:24px;overflow:hidden;
  box-shadow:0 18px 40px rgba(122,23,64,.28);border:4px solid #fff;background:#fff}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .8s ease;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;padding:18px 18px 8px}
.slide.on{opacity:1}
.slide .art{width:100%;height:100%}
.slide .sp{position:absolute;font-size:22px;animation:tw 2.4s ease-in-out infinite}
@keyframes tw{0%,100%{transform:scale(.7) rotate(0);opacity:.4}50%{transform:scale(1.2) rotate(15deg);opacity:1}}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;background:#ffffffe6;color:var(--rose);font-size:22px;
  display:flex;align-items:center;justify-content:center;padding:0;z-index:3;box-shadow:0 3px 10px #0003}
.arrow.l{left:8px}.arrow.r{right:8px}
.dots{display:flex;gap:7px;margin:12px 0 4px}
.dots i{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 1px 4px #0002;transition:.3s}
.dots i.on{background:var(--rose);width:22px;border-radius:6px}
.cap{font-size:13.5px;font-style:italic;color:#7a4a5e;text-align:center;min-height:42px;max-width:360px;line-height:1.45}
.ask{margin-top:6px;color:#d6004f;font-size:16px;font-weight:600;text-align:center}
.b-small{background:linear-gradient(90deg,#ff1a82,#e0002a);padding:13px 30px;font-size:15px;margin-top:10px;box-shadow:0 8px 18px #ff1a8255}
.hide{display:none!important}

/* ===== S3 game ===== */
#s3{background:linear-gradient(135deg,#6a11cb,#2575fc,#00e5a8,#6a11cb);background-size:400% 400%;color:#fff;gap:10px;z-index:5}
#s3.playing{touch-action:none}
#s3.active{animation:bgm 12s ease infinite}
@keyframes bgm{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.neon{font-weight:800;font-size:clamp(20px,6vw,30px);color:#ff4fa8;text-shadow:0 0 8px #ff2f9e,0 0 20px #ff2f9eaa;text-align:center}
.gbox{position:relative;width:min(92vw,380px);height:min(calc(var(--vh,1vh)*58),460px);min-height:260px;flex-shrink:0;border-radius:24px;background:rgba(255,255,255,.17);
  border:2px solid rgba(255,255,255,.5);backdrop-filter:blur(8px);box-shadow:0 14px 40px #0005;overflow:hidden;touch-action:none}
.count{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:4;background:linear-gradient(90deg,#ff5e9c,#38d6ff);
  padding:7px 20px;border-radius:999px;font:700 14px 'Poppins';white-space:nowrap;box-shadow:0 3px 12px #0003}
.basket{position:absolute;bottom:8px;left:50%;width:62px;height:48px;z-index:3;transform:translateX(-50%)}
.basket i{position:absolute;inset:0;background:linear-gradient(#ff7cc0,#ff1e8e);border-radius:55% 55% 30% 30%;box-shadow:0 0 18px #ff2f9e}
.basket b{position:absolute;top:-10px;right:4px;font-size:18px}
.basket u{position:absolute;top:16px;left:27px;width:6px;height:6px;background:#fff;border-radius:50%}
.orb{position:absolute;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#ffc4e2,#ff4fa3);box-shadow:0 0 14px #ff8cc8;font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2}
.win{display:none;flex-direction:column;align-items:center;gap:12px;padding:26px 20px;text-align:center;width:min(92vw,380px);border-radius:24px;
  background:rgba(90,20,70,.4);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:2px solid rgba(255,255,255,.5);box-shadow:0 14px 40px #0005}
.win.on{display:flex;animation:fadeIn .6s}
.win h3{font-weight:800;font-size:24px;text-shadow:0 2px 10px #0004}
.win p{font-size:14px;line-height:1.55}
.win input{width:100%;padding:12px 16px;border-radius:999px;border:2px solid #fff8;background:#fff5;color:#fff;font:14px 'Poppins';text-align:center;outline:0}
.win input::placeholder{color:#fff}
.win button{padding:13px 26px;font-size:14px;background:linear-gradient(90deg,#ff1a82,#e0002a);box-shadow:0 6px 16px #ff1a8266;width:100%;max-width:240px}
.hint{font-size:12px;opacity:.9}

/* ===== S4 letter ===== */
#s4 .hero{width:150px;height:130px;margin-bottom:2px}
.paper{position:relative;width:min(94vw,440px);border-radius:22px;padding:22px 22px 20px;background:
  repeating-linear-gradient(transparent 0 31px,#f4c7d6 31px 32px),#fff9f4;box-shadow:0 18px 44px rgba(122,23,64,.3);border:1px solid #ffd8e4}
.paper::before{content:'💌';position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:34px;filter:drop-shadow(0 4px 6px #0003)}
.paper h4{font-family:'Dancing Script',cursive;font-size:28px;color:#e0115f;text-align:center;margin:6px 0 8px}
#letterText{font-family:'Caveat',cursive;font-size:21px;line-height:32px;color:#6a1f3c;white-space:pre-wrap;min-height:120px;font-weight:500}
.caret{display:inline-block;width:2px;height:20px;background:var(--rose);vertical-align:-3px;animation:bl .8s infinite}
@keyframes bl{50%{opacity:0}}
.sig{font-family:'Dancing Script',cursive;font-size:24px;color:#e0115f;text-align:right;margin-top:6px}
.final{margin-top:16px;display:flex;flex-direction:column;gap:10px;align-items:center;opacity:0;transform:translateY(10px);transition:.8s;pointer-events:none}
.final.on{opacity:1;transform:none;pointer-events:all}
.b-big{background:linear-gradient(90deg,#ff1a82,#e0002a);padding:16px 36px;font-size:17px;box-shadow:0 10px 24px #ff1a8266;animation:pulse 1.6s infinite}
.mini{background:#ffffffb0;color:#b0124a;font-weight:600;padding:9px 20px;font-size:13px;box-shadow:none}
.stk{display:flex;gap:8px;margin-top:6px}
.stk img{height:70px;border-radius:12px}

/* ===== thank-you overlay ===== */
#thanks{position:fixed;inset:0;z-index:250;overflow-y:auto;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:linear-gradient(160deg,#ff8fb1,#ffe0ea);animation:fadeIn .6s}
#thanks.on{display:flex}
#thanks .hero{width:210px;height:180px}
#thanks h2{font-family:'Dancing Script',cursive;font-size:clamp(38px,11vw,54px);color:#c40f55;line-height:1.1;text-shadow:0 3px 0 #fff}
#thanks p{margin-top:10px;font-size:16px;font-weight:600;color:#7a1740}

/* music button */
#music{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:150;width:44px;height:44px;border-radius:50%;
  background:#ffffffd9;color:var(--rose);font-size:20px;padding:0;box-shadow:0 4px 14px #0003;display:none;align-items:center;justify-content:center}
#music.show{display:flex}
#music.on span{display:inline-block;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media(min-width:760px){
  .card .art{height:110px}.card p{font-size:16px}
  #letterText{font-size:23px}
}
</style>
</head>
<body>
<div class="bg"></div><div class="blob a"></div><div class="blob b"></div>

<button id="music" aria-label="music"><span>🎵</span></button>
<div style="position:fixed;left:-400px;top:0;width:200px;height:200px;pointer-events:none"><div id="yt"></div></div>

<!-- ================= S0 intro ================= -->
<section class="screen active" id="s0">
  <div class="env">💌</div>
  <h1 class="script" id="t0"></h1>
  <p id="p0"></p>
  <button class="b-open" id="open">Tap to open 💗</button>
</section>

<!-- ================= S1 landing ================= -->
<section class="screen" id="s1">
  <div class="pill glass">💌 a little apology, just for you</div>
  <h1 class="script" id="t1"></h1>
  <span class="beat">💗</span>
  <div class="msg glass" id="m1"></div>
  <div class="cards">
    <div class="card glass"><div class="art" data-art="bunny"></div><p>Missing you like crazy... 💗</p></div>
    <div class="card glass"><div class="art" data-art="blob"></div><p>My heart belongs to you... 🧡</p></div>
    <div class="card glass"><div class="art" data-art="puppy"></div><p>Please come back to me... 💗</p></div>
  </div>
  <div class="btns">
    <button class="b-yes" id="yes">Yes, I Forgive You! 💕</button>
    <button class="b-no" id="no">Not Yet... 🥺</button>
  </div>
  <div class="foot" id="foot"></div>
</section>

<!-- ================= S2 memory lane ================= -->
<section class="screen" id="s2">
  <h2 class="script" id="t2"></h2>
  <p class="sub" id="sub2"></p>
  <div class="slider" id="slider">
    <button class="arrow l" id="prev">‹</button>
    <button class="arrow r" id="next">›</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="cap" id="cap"></div>
  <div class="ask hide" id="ask">
    <div id="askTxt"></div>
    <button class="b-small" id="still">Still not forgiving me?</button>
  </div>
</section>

<!-- ================= S3 game ================= -->
<section class="screen" id="s3">
  <div class="neon">💗 Catch My Heart &amp; Sorry 💗</div>
  <div class="gbox" id="box">
    <div class="count" id="count">Sorry Letters: 0 / 10</div>
    <div class="basket" id="basket"><i></i><b>🎀</b><u></u></div>
  </div>
  <div class="hint" id="hint">Slide your finger to move the basket 💞</div>
  <div class="win" id="win">
    <h3>You've Captured My Heart!</h3>
    <p id="winTxt"></p>
    <input id="feel" placeholder="Write your feelings here... ❤️">
    <button id="forgive">Yes, I Forgive You!</button>
    <button id="more">Need More Convincing 🥺</button>
  </div>
</section>

<!-- ================= S4 letter ================= -->
<section class="screen" id="s4">
  <div class="hero" data-art="bunnyCry"></div>
  <div class="paper">
    <h4 id="dear"></h4>
    <p id="letterText"></p><span class="caret" id="caret"></span>
    <div class="sig" id="sig"></div>
  </div>
  <div class="stk" id="stk"></div>
  <div class="final" id="final">
    <button class="b-big" id="forgive2">💖 I Forgive You</button>
    <button class="mini" id="replay">🔁 Read it again</button>
  </div>
</section>

<!-- thank you -->
<div id="thanks">
  <div class="hero" data-art="bunnyHappy"></div>
  <h2 id="thanksT"></h2>
  <p id="thanksP"></p>
</div>

<div id="wipe"></div>

<script>
/* =====================================================
   ✏️  CONFIG — change names, messages, photos, song here
   ===================================================== */
const CONFIG = {
  nickname: "Dr. Ma'am",
  introTitle: "Sorry, Dr. Ma'am 🥺",
  introText: "I made something for you...",
  title1: "Dr. Ma'am, I'm Sorry",
  message1: "Every moment without your smile feels like an eternity... Will you find it in your heart to forgive me? 🥺",
  footer: "",                                   // e.g. "Made with love by Rahul" (hidden if empty)

  subtitle2: "Each picture holds a story... I never want to be the reason you stop smiling.",
  question2: "Did I make you smile a little? ♥",

  /* Memory Lane slides. Cute sorry characters show by default.
     To use YOUR OWN photo instead: put it in an "images" folder
     (images/1.jpg ...) — if the file exists, it replaces the drawing. */
  photos: [
    { src:"images/1.jpg", art:"bunnyCry", sign:"SORRY",       caption:"I know I hurt you, and I hate myself for it. 🥺" },
    { src:"images/2.jpg", art:"bear",     sign:"I'M SORRY",   caption:"You didn't deserve that at all. I'm really sorry, my love." },
    { src:"images/3.jpg", art:"puppy",    sign:"FORGIVE ME?", caption:"Please forgive me this once... 🐶💗" },
    { src:"images/4.jpg", art:"cat",      sign:"SORRY",       caption:"I should have respected your time. 💐" },
    { src:"images/5.jpg", art:"bunnyPink",sign:"8 PM ❤",      caption:"Tomorrow at 8 PM. I promise I'll be there. 🤞" }
  ],

  winText: "Every letter caught is a piece of my sincere apology... 💔<br><br>I promise to make it up to you! 🥹",
  letterTitle: "Dear Dr. Ma'am,",
  letter:
`I know I hurt you, and I hate myself for it. You didn't deserve that at all.

I'm really sorry, my love.

I know I promised to come and didn't make it. I should have respected your time, and I'm sorry.

Please forgive me this once. I'll definitely come tomorrow at 8 PM. I promise I'll be there.

You deserve effort, not just words. ❤️`,
  signature: "",                                // e.g. "— Yours, Rahul"

  thankYou: "Thank you for forgiving me! ❤️",
  thankYouSub: "See you tomorrow at 8 PM, Dr. Ma'am 💗",
  convincing: ["I'll plan our favourite dinner 🍝","I promise to listen better 💗","Unlimited hugs from now on 🤗","You mean the world to me 🌍❤️","I'm really, truly sorry 🥺"],
  lettersToCatch: 10,

  /* Optional: add real GIF links to show on the letter page, e.g. ["https://media.giphy.com/media/xxxx/giphy.gif"] */
  gifs: [],

  /* 🎵 Song: YouTube video id (from your link). Optional: drop "song.mp3" next to this file and it plays instead. */
  youtubeId: "tpuuhD-EUBQ",
  songFile: "song.mp3"
};

/* ================== cute character art ================== */
function animal(o){
  const ink='#3a2a2a', f=o.fur||'#fff', inner=o.inner||'#ffb3c6';
  let ears='';
  if(o.ears==='bunny') ears=`<g class="ear"><ellipse cx="74" cy="28" rx="12" ry="30" fill="${f}"/><ellipse cx="74" cy="30" rx="6" ry="20" fill="${inner}" stroke="none"/><ellipse cx="126" cy="28" rx="12" ry="30" fill="${f}"/><ellipse cx="126" cy="30" rx="6" ry="20" fill="${inner}" stroke="none"/></g>`;
  if(o.ears==='bear')  ears=`<circle cx="58" cy="48" r="16" fill="${f}"/><circle cx="58" cy="48" r="8" fill="${inner}" stroke="none"/><circle cx="142" cy="48" r="16" fill="${f}"/><circle cx="142" cy="48" r="8" fill="${inner}" stroke="none"/>`;
  if(o.ears==='cat')   ears=`<path d="M52 62 L58 20 L92 44Z" fill="${f}"/><path d="M148 62 L142 20 L108 44Z" fill="${f}"/><path d="M60 50 L62 32 L78 44Z" fill="${inner}" stroke="none"/><path d="M140 50 L138 32 L122 44Z" fill="${inner}" stroke="none"/>`;
  if(o.ears==='puppy') ears=`<ellipse cx="50" cy="78" rx="15" ry="30" transform="rotate(14 50 78)" fill="${o.ear||'#d9b48a'}"/><ellipse cx="150" cy="78" rx="15" ry="30" transform="rotate(-14 150 78)" fill="${o.ear||'#d9b48a'}"/>`;
  const nose = o.ears==='bunny' ? `<path d="M96 92 Q100 96 104 92 Q100 89 96 92Z" fill="#ff7a9e" stroke="none"/>` : `<ellipse cx="100" cy="91" rx="5.5" ry="3.8" fill="${ink}" stroke="none"/>`;
  const sz = o.sign.length>8 ? 11 : 14;
  const patch = o.ears==='puppy' ? `<ellipse cx="128" cy="68" rx="16" ry="14" fill="${o.ear||'#d9b48a'}" stroke="none"/>` : '';
  return `<svg viewBox="0 0 200 175" class="char"><g stroke="${ink}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    ${ears}
    <ellipse cx="100" cy="142" rx="46" ry="28" fill="${f}"/>
    <ellipse cx="100" cy="84" rx="56" ry="46" fill="${f}"/>${patch}
    <ellipse cx="80" cy="84" rx="5.5" ry="8" fill="${ink}"/><ellipse cx="120" cy="84" rx="5.5" ry="8" fill="${ink}"/>
    <path d="M68 70 L91 64 M109 64 L132 70" fill="none"/>
    ${nose}<path d="M91 102 Q100 95 109 102" fill="none"/>
    <rect x="50" y="118" width="100" height="36" rx="7" fill="#d9a86c"/>
    <circle cx="50" cy="130" r="10" fill="${f}"/><circle cx="150" cy="130" r="10" fill="${f}"/>
  </g>
  <circle cx="82" cy="80" r="2.4" fill="#fff"/><circle cx="122" cy="80" r="2.4" fill="#fff"/>
  <circle cx="64" cy="98" r="10" fill="#ff9db8" opacity=".75"/><circle cx="136" cy="98" r="10" fill="#ff9db8" opacity=".75"/>
  ${o.tears?`<path class="tear" d="M76 96 q-6 11 0 15 q6 -4 0 -15z" fill="#8fd3ff"/><path class="tear t2" d="M124 96 q-6 11 0 15 q6 -4 0 -15z" fill="#8fd3ff"/>`:''}
  <text x="100" y="141" text-anchor="middle" font-family="Poppins,Arial" font-weight="800" font-size="${sz}" fill="#fff">${o.sign}</text>
  ${o.extra||''}</svg>`;
}
const ART = {
  bunny:   s=>animal({ears:'bunny',sign:s||'SORRY',tears:true}),
  bunnyCry:s=>animal({ears:'bunny',sign:s||'SORRY',tears:true,extra:'<text x="160" y="40" font-size="22">💔</text>'}),
  bunnyPink:s=>animal({ears:'bunny',sign:s||'8 PM ❤',fur:'#ffe4ee',extra:'<text x="156" y="38" font-size="22">💗</text>'}),
  bunnyHappy:()=>animal({ears:'bunny',sign:'THANK U ❤',fur:'#fff',extra:'<text x="150" y="40" font-size="26">💖</text><text x="20" y="50" font-size="22">✨</text>'}),
  bear:    s=>animal({ears:'bear',sign:s||'SORRY',fur:'#e8c9a0',inner:'#ffb3c6',tears:true,extra:'<text x="156" y="40" font-size="22">🥺</text>'}),
  puppy:   s=>animal({ears:'puppy',sign:s||'SORRY',fur:'#fffaf2',ear:'#d9b48a',tears:true,extra:'<text x="150" y="40" font-size="22">🐾</text>'}),
  cat:     s=>animal({ears:'cat',sign:s||'SORRY',fur:'#ffdcae',inner:'#ffb3c6',tears:true,extra:'<text x="146" y="166" font-size="30">💐</text>'}),
  blob:    ()=>`<svg viewBox="0 0 200 175" class="char"><g stroke="#3a2a2a" stroke-width="3" stroke-linecap="round"><ellipse cx="100" cy="100" rx="58" ry="46" fill="#fff"/><ellipse cx="80" cy="104" rx="8" ry="11" fill="#3a2a2a"/><ellipse cx="120" cy="104" rx="8" ry="11" fill="#3a2a2a"/><path d="M92 126 Q100 132 108 126" fill="none"/></g><circle cx="82" cy="99" r="2.5" fill="#fff"/><circle cx="122" cy="99" r="2.5" fill="#fff"/><circle cx="64" cy="118" r="9" fill="#ff9db8" opacity=".7"/><circle cx="136" cy="118" r="9" fill="#ff9db8" opacity=".7"/><text x="100" y="40" text-anchor="middle" font-family="Poppins" font-weight="800" font-size="20" fill="#3a2a2a">SORRY</text></svg>`
};
document.querySelectorAll('[data-art]').forEach(el=>{ el.innerHTML=ART[el.dataset.art](); });

/* ================== helpers ================== */
const $ = id => document.getElementById(id);
function setVH(){ document.documentElement.style.setProperty('--vh',(window.innerHeight*0.01)+'px'); }
setVH(); addEventListener('resize',setVH);
const show = id => { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); };
const toast = t => { const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2300); };
function wipeTo(fn){ const w=$('wipe'); w.classList.add('show'); setTimeout(()=>{fn(); setTimeout(()=>w.classList.remove('show'),150);},850); }
function rain(e,n=40){ for(let i=0;i<n;i++) setTimeout(()=>{ const d=document.createElement('div'); d.className='rain'; d.textContent=e; d.style.left=Math.random()*100+'vw'; d.style.fontSize=(20+Math.random()*18)+'px'; d.style.animationDuration=(2+Math.random()*2)+'s'; document.body.appendChild(d); setTimeout(()=>d.remove(),4300); }, i*50); }
function confetti(n=60){ for(let i=0;i<n;i++) setTimeout(()=>{ const c=document.createElement('div'); c.className='confetti'; c.textContent=['💖','⭐','🌹','✨','💕','🌸'][Math.random()*6|0]; c.style.left=Math.random()*100+'vw'; c.style.fontSize=(14+Math.random()*16)+'px'; c.style.animationDuration=(2.5+Math.random()*2)+'s'; document.body.appendChild(c); setTimeout(()=>c.remove(),5200); }, i*40); }

/* ---- text ---- */
$('t0').textContent=CONFIG.introTitle; $('p0').textContent=CONFIG.introText;
$('t1').textContent=CONFIG.title1; $('m1').textContent=CONFIG.message1;
$('foot').textContent=CONFIG.footer?("💗 "+CONFIG.footer+" 💗"):'';
$('t2').textContent=`${CONFIG.nickname}, let's take a little trip down Memory Lane... 💕`;
$('sub2').textContent=CONFIG.subtitle2; $('askTxt').textContent=CONFIG.question2;
$('winTxt').innerHTML=CONFIG.winText; $('dear').textContent=CONFIG.letterTitle; $('sig').textContent=CONFIG.signature;
$('thanksT').textContent=CONFIG.thankYou; $('thanksP').textContent=CONFIG.thankYouSub;
$('thanks').querySelector('.hero').innerHTML=ART.bunnyHappy();

/* ---- floating hearts ---- */
setInterval(()=>{
  const on=['s0','s1','s2','s4'].some(i=>$(i).classList.contains('active')); if(!on) return;
  const h=document.createElement('div'); h.className='floaty'; h.textContent=['💗','💕','💖','🌸','✨'][Math.random()*5|0];
  h.style.left=Math.random()*100+'vw'; h.style.fontSize=(12+Math.random()*18)+'px'; h.style.animationDuration=(6+Math.random()*5)+'s';
  document.body.appendChild(h); setTimeout(()=>h.remove(),11500);
},600);

/* ================== 🎵 music ================== */
const music={on:false,want:false,yt:null,ready:false,audio:null,failed:false};
if(CONFIG.songFile){ try{ music.audio=new Audio(CONFIG.songFile); music.audio.loop=true; }catch(e){} }
function setMusic(on){ music.on=on; $('music').classList.toggle('on',on); }
function ytPlay(){ if(music.ready&&music.yt){ try{ music.yt.playVideo(); setMusic(true);}catch(e){} } }
function startMusic(){
  music.want=true;
  if(music.audio){ music.audio.play().then(()=>setMusic(true)).catch(()=>ytPlay()); } else ytPlay();
}
function stopMusic(){ music.want=false; if(music.audio) try{music.audio.pause()}catch(e){} if(music.yt&&music.ready) try{music.yt.pauseVideo()}catch(e){} setMusic(false); }
$('music').onclick=()=>{ if(music.failed && !music.audio){ window.open('https://youtube.com/shorts/'+CONFIG.youtubeId,'_blank'); return; } music.on?stopMusic():startMusic(); };
window.onYouTubeIframeAPIReady=function(){
  try{
    music.yt=new YT.Player('yt',{width:200,height:200,videoId:CONFIG.youtubeId,
      playerVars:{playsinline:1,controls:0,loop:1,playlist:CONFIG.youtubeId,rel:0,modestbranding:1},
      events:{
        onReady:()=>{ music.ready=true; if(music.want && !(music.audio&&!music.audio.paused)) ytPlay(); },
        onError:()=>{ music.failed=true; if(music.want) toast('Tap 🎵 to play the song on YouTube'); },
        onStateChange:e=>{ if(e.data===0){ try{music.yt.playVideo()}catch(_){} } }
      }});
  }catch(e){ music.failed=true; }
};
(function(){ const s=document.createElement('script'); s.src='https://www.youtube.com/iframe_api'; s.onerror=()=>{music.failed=true}; document.head.appendChild(s); })();

/* ================== S0 → S1 ================== */
$('open').onclick=()=>{ startMusic(); $('music').classList.add('show'); $('s0').style.zIndex=''; show('s1'); };

/* ================== S1 ================== */
let yesScale=1;
$('no').onclick=()=>{ rain('🥺',28); toast('Please? I really am sorry... 🥺'); yesScale=Math.min(1.35,yesScale+.1); $('yes').style.transform=`scale(${yesScale})`; };
$('yes').onclick=()=>{ rain('🥺',45); setTimeout(()=>wipeTo(startMemory),2300); };

/* ================== S2 slider ================== */
let idx=0,timer,seen=new Set();
const sparkles=['✨','💗','🌸'];
CONFIG.photos.forEach((p,i)=>{
  const d=document.createElement('div'); d.className='slide'+(i?'':' on');
  d.style.background=['linear-gradient(160deg,#ffe0ea,#ffc2d4)','linear-gradient(160deg,#fff0d9,#ffd2c2)','linear-gradient(160deg,#e9ddff,#ffd1e8)','linear-gradient(160deg,#d9f3ff,#ffe0ee)','linear-gradient(160deg,#ffe0ea,#ffc9a8)'][i%5];
  d.innerHTML=`<div class="art">${ART[p.art](p.sign)}</div>`+
    [0,1,2].map(k=>`<span class="sp" style="left:${10+Math.random()*78}%;top:${6+Math.random()*30}%;animation-delay:${k*.7}s">${sparkles[k]}</span>`).join('');
  const im=new Image(); im.onload=()=>{ d.innerHTML=''; d.style.background=`center/cover url("${p.src}")`; }; im.src=p.src;
  $('slider').appendChild(d);
  const dot=document.createElement('i'); if(!i) dot.className='on'; $('dots').appendChild(dot);
});
function go(n){
  const s=document.querySelectorAll('.slide'), dt=document.querySelectorAll('.dots i');
  s[idx].classList.remove('on'); dt[idx].classList.remove('on');
  idx=(n+s.length)%s.length; s[idx].classList.add('on'); dt[idx].classList.add('on');
  $('cap').textContent=CONFIG.photos[idx].caption; seen.add(idx);
  if(seen.size>=Math.min(3,s.length)) $('ask').classList.remove('hide');
}
function auto(){ clearInterval(timer); timer=setInterval(()=>go(idx+1),3800); }
$('prev').onclick=()=>{go(idx-1);auto()}; $('next').onclick=()=>{go(idx+1);auto()};
let sx=0; $('slider').addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
$('slider').addEventListener('touchend',e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40){go(idx+(dx<0?1:-1));auto();} });
function startMemory(){ show('s2'); seen=new Set([0]); document.querySelectorAll('.slide').forEach((s,i)=>s.classList.toggle('on',i===0)); document.querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('on',i===0)); idx=0; $('cap').textContent=CONFIG.photos[0].caption; auto(); }
$('still').onclick=()=>{ clearInterval(timer); wipeTo(startGame); };

/* ================== S3 game ================== */
let caught=0,playing=false,bx=.5,spawnT,loopT,orbs=[];
const box=$('box'), basket=$('basket'), BW=62;
function place(){ const r=box.getBoundingClientRect(); basket.style.left=(bx*(r.width-BW)+BW/2)+'px'; }
function moveTo(cx){ const r=box.getBoundingClientRect(); bx=Math.min(1,Math.max(0,(cx-r.left-BW/2)/(r.width-BW))); place(); }
$('s3').addEventListener('touchmove',e=>{ if(playing) moveTo(e.touches[0].clientX); },{passive:true});
$('s3').addEventListener('touchstart',e=>{ if(playing) moveTo(e.touches[0].clientX); },{passive:true});
$('s3').addEventListener('mousemove',e=>{ if(playing) moveTo(e.clientX); });
addEventListener('keydown',e=>{ if(!playing)return; if(e.key==='ArrowLeft')bx=Math.max(0,bx-.08); if(e.key==='ArrowRight')bx=Math.min(1,bx+.08); place(); });
function startGame(){
  show('s3'); caught=0; playing=true; $('win').classList.remove('on'); $('count').style.display='';
  $('s3').classList.add('playing'); $('box').style.display=''; $('hint').style.display='';
  $('count').textContent=`Sorry Letters: 0 / ${CONFIG.lettersToCatch}`;
  orbs.forEach(o=>o.el.remove()); orbs=[]; bx=.5; place();
  clearInterval(spawnT); clearInterval(loopT); spawnT=setInterval(spawn,800); loopT=setInterval(tick,16);
}
function spawn(){ const r=box.getBoundingClientRect(); const el=document.createElement('div'); el.className='orb'; el.textContent='✉'; const x=8+Math.random()*(r.width-42); el.style.left=x+'px'; el.style.top='-30px'; box.appendChild(el); orbs.push({el,x,y:-30,v:1.8+Math.random()*1.6}); }
function tick(){
  const r=box.getBoundingClientRect(), bL=bx*(r.width-BW), bR=bL+BW, bTop=r.height-54;
  orbs=orbs.filter(o=>{
    o.y+=o.v; o.el.style.top=o.y+'px';
    if(o.y+26>=bTop && o.y<r.height && o.x+26>=bL-4 && o.x<=bR+4){
      o.el.remove(); caught++; $('count').textContent=`Sorry Letters: ${caught} / ${CONFIG.lettersToCatch}`; if(navigator.vibrate) navigator.vibrate(15);
      if(caught>=CONFIG.lettersToCatch) win(); return false; }
    if(o.y>r.height){ o.el.remove(); return false; } return true;
  });
}
function win(){ playing=false; clearInterval(spawnT); clearInterval(loopT); orbs.forEach(o=>o.el.remove()); orbs=[]; $('count').style.display='none'; $('s3').classList.remove('playing'); $('box').style.display='none'; $('hint').style.display='none'; $('win').classList.add('on'); confetti(60); }
$('forgive').onclick=()=>{ confetti(70); setTimeout(()=>wipeTo(startLetter),1100); };
let ci=0; $('more').onclick=()=>{ toast(CONFIG.convincing[ci++%CONFIG.convincing.length]); rain('🥺',10); setTimeout(()=>wipeTo(startLetter),1600); };

/* ================== S4 letter (typewriter) ================== */
let typeT;
function startLetter(){
  show('s4'); $('final').classList.remove('on'); $('letterText').textContent=''; $('caret').style.display='';
  const txt=CONFIG.letter; let i=0; clearInterval(typeT);
  typeT=setInterval(()=>{ i++; $('letterText').textContent=txt.slice(0,i); $('caret').scrollIntoView({block:'nearest'}); if(i>=txt.length) done(); },38);
  $('s4').onclick=e=>{ if(e.target.closest('button')) return; if(i<txt.length){ i=txt.length-1; } };
  function done(){ clearInterval(typeT); $('caret').style.display='none'; $('final').classList.add('on'); $('s4').scrollTo({top:$('s4').scrollHeight,behavior:'smooth'}); }
}
$('replay').onclick=startLetter;
$('forgive2').onclick=()=>{ $('thanks').classList.add('on'); confetti(100); setTimeout(()=>confetti(70),1500); setTimeout(()=>confetti(70),3200); if(navigator.vibrate) navigator.vibrate([60,40,60]); };

/* optional gifs on letter page */
CONFIG.gifs.forEach(u=>{ const im=document.createElement('img'); im.src=u; $('stk').appendChild(im); });
</script>
</body>
</html>
