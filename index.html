<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbeee9">
<title>A Small Apology</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one calm column. A doctor-themed sorry scene (ECG heartbeat + crying bunny doctor), a voice note, one line, two answers. */
:root{--bg:#fbeee9;--card:#fffaf7;--ink:#4a2c35;--soft:#8a6571;--rose:#c9677f;--rose2:#b2506a;--line:#f0d9d3;--bar:#f0d9d3;--glow1:#f9d9d5;--glow2:#f3dcec;--shadow:rgba(178,80,106,.14);--coat:#ffffff;--steth:#6c7c8c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#241319;--card:#301d25;--ink:#f7e6e9;--soft:#cba6b1;--rose:#e07a94;--rose2:#c9607c;--line:#4a2d38;--bar:#4a2d38;--glow1:#3b1d28;--glow2:#2f1d3a;--shadow:rgba(0,0,0,.35);--coat:#f6eef0;--steth:#9fb0c0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241319;--card:#301d25;--ink:#f7e6e9;--soft:#cba6b1;--rose:#e07a94;--rose2:#c9607c;--line:#4a2d38;--bar:#4a2d38;--glow1:#3b1d28;--glow2:#2f1d3a;--shadow:rgba(0,0,0,.35);--coat:#f6eef0;--steth:#9fb0c0;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;color:var(--ink);min-height:100vh;overflow-x:hidden;
  background:radial-gradient(70% 40% at 20% 0%,var(--glow1) 0,transparent 70%),radial-gradient(60% 40% at 100% 100%,var(--glow2) 0,transparent 70%),var(--bg);
  padding-block:26px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
main{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;z-index:2}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(34px,10.5vw,46px);line-height:1.1;text-align:center;margin:6px 0 0;text-wrap:balance}
.hero{position:relative;width:min(78vw,300px);aspect-ratio:240/230}
.halo{position:absolute;inset:-10%;border-radius:50%;background:radial-gradient(closest-side,var(--rose),transparent);opacity:.22;animation:halo 3.6s ease-in-out infinite}
@keyframes halo{0%,100%{transform:scale(.92);opacity:.16}50%{transform:scale(1.06);opacity:.3}}
.char{position:relative;z-index:1;width:100%;height:100%;overflow:visible;animation:bob 2.8s ease-in-out infinite;transform-origin:50% 92%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-7px) rotate(1.5deg)}}
.tear{animation:tear 1.7s ease-in infinite;opacity:0}.tear.t2{animation-delay:.85s}
@keyframes tear{0%{transform:translateY(0);opacity:0}25%{opacity:1}100%{transform:translateY(30px);opacity:0}}
.ear{animation:ear 2.8s ease-in-out infinite;transform-origin:50% 70%}
@keyframes ear{0%,100%{transform:rotate(0)}50%{transform:rotate(-2.5deg)}}
.hbeat{transform-box:fill-box;transform-origin:center;animation:hb 1.2s ease-in-out infinite}
@keyframes hb{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
/* ECG */
.ecg{width:100%;max-width:380px;height:64px;overflow:visible}
.ecg path{fill:none;stroke:var(--rose);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:trace 2.6s linear infinite;filter:drop-shadow(0 0 4px var(--rose))}
@keyframes trace{0%{stroke-dashoffset:420}60%,100%{stroke-dashoffset:0}}
/* player */
.card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:16px 18px;box-shadow:0 10px 30px var(--shadow)}
.player{display:flex;align-items:center;gap:14px}
#play{flex:none;width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px var(--shadow);cursor:pointer;touch-action:manipulation;animation:pulse 1.8s ease-in-out infinite}
#play.on{animation:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.wave{flex:1;min-width:0;display:flex;align-items:center;gap:3px;height:44px;cursor:pointer}
.wave i{flex:1;border-radius:3px;background:var(--bar);transition:background .15s;min-height:6px}
.wave i.done{background:var(--rose)}
.wave.live i{animation:wv .9s ease-in-out infinite alternate}
@keyframes wv{to{transform:scaleY(.55)}}
.time{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;flex:none;min-width:34px;text-align:right}
.line{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(22px,6.6vw,28px);line-height:1.3;text-align:center;color:var(--rose2);margin:4px 0 2px;text-wrap:balance}
.choices{width:100%;display:flex;flex-direction:column;gap:12px}
.choices a,.choices button{display:block;width:100%;text-align:center;text-decoration:none;font:600 16px 'Poppins',system-ui,sans-serif;padding:16px 18px;border-radius:999px;cursor:pointer;touch-action:manipulation}
.talk{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;border:0;box-shadow:0 8px 20px var(--shadow)}
.later{background:transparent;color:var(--rose);border:1.5px solid var(--rose)}
#play:focus-visible,.choices a:focus-visible,.choices button:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.okay{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:20px;color:var(--rose2);text-align:center}
.fl{position:fixed;bottom:-30px;pointer-events:none;z-index:1;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) translateX(24px) rotate(18deg);opacity:0}}
.union{width:150px;height:52px;overflow:visible}
.u1{animation:m1 5s ease-in-out infinite}.u2{animation:m2 5s ease-in-out infinite}
@keyframes m1{0%{transform:translateX(-50px)}45%,75%{transform:translateX(-6px)}100%{transform:translateX(-50px)}}
@keyframes m2{0%{transform:translateX(50px)}45%,75%{transform:translateX(6px)}100%{transform:translateX(50px)}}
.uglow{opacity:0;animation:ug 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ug{0%,35%{opacity:0;transform:scale(.6)}55%,72%{opacity:.55;transform:scale(1.15)}100%{opacity:0;transform:scale(.6)}}
.pt{position:fixed;top:-30px;pointer-events:none;z-index:1;opacity:.85;animation:petal linear forwards}
@keyframes petal{to{transform:translate(40px,115vh) rotate(300deg)}}
@media (prefers-reduced-motion:reduce){.char,.tear,.ear,.hbeat,#play,.wave.live i,.halo,.u1,.u2,.uglow{animation:none}.tear{opacity:0}.ecg path{animation:none;stroke-dashoffset:0}.u1{transform:translateX(-6px)}.u2{transform:translateX(6px)}}
</style>

</head>
<body>
<main>
  <h1>Sorry, Dr. Ma'am</h1>

  <div class="hero" aria-hidden="true">
    <div class="halo"></div>
    <svg viewBox="0 0 240 230" class="char">
      <g stroke="#3a2a2a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
        <g class="ear">
          <ellipse cx="88" cy="34" rx="14" ry="34" fill="#fff"/><ellipse cx="88" cy="38" rx="7" ry="22" fill="#ffb3c6" stroke="none"/>
          <ellipse cx="152" cy="34" rx="14" ry="34" fill="#fff"/><ellipse cx="152" cy="38" rx="7" ry="22" fill="#ffb3c6" stroke="none"/>
        </g>
        <!-- white coat -->
        <path d="M58 226 C54 168 74 134 120 128 C166 134 186 168 182 226 Z" fill="var(--coat)"/>
        <path d="M96 132 L120 176 L144 132" fill="none"/>
        <!-- stethoscope -->
        <path d="M92 134 C84 176 118 188 128 170 C136 156 150 170 156 184" fill="none" stroke="var(--steth)" stroke-width="4"/>
        <circle cx="158" cy="190" r="9" fill="#c9d3dc"/>
        <!-- head -->
        <ellipse cx="120" cy="88" rx="60" ry="50" fill="#fff"/>
        <ellipse cx="98" cy="90" rx="6" ry="9" fill="#3a2a2a"/><ellipse cx="142" cy="90" rx="6" ry="9" fill="#3a2a2a"/>
        <path d="M84 74 L109 68 M131 68 L156 74" fill="none"/>
        <path d="M114 103 Q120 108 126 103 Q120 99 114 103Z" fill="#ff7a9e" stroke="none"/>
        <path d="M110 114 Q120 106 130 114" fill="none"/>
      </g>
      <circle cx="100" cy="86" r="2.6" fill="#fff"/><circle cx="144" cy="86" r="2.6" fill="#fff"/>
      <circle cx="80" cy="106" r="11" fill="#ff9db8" opacity=".75"/><circle cx="160" cy="106" r="11" fill="#ff9db8" opacity=".75"/>
      <path class="tear" d="M92 108 q-7 12 0 17 q7 -5 0 -17z" fill="#8fd3ff"/>
      <path class="tear t2" d="M148 108 q-7 12 0 17 q7 -5 0 -17z" fill="#8fd3ff"/>
      <!-- medical cross badge -->
      <g transform="translate(82 168)"><rect x="-9" y="-9" width="18" height="18" rx="4" fill="#fff" stroke="#3a2a2a" stroke-width="2"/><path d="M0 -5 V5 M-5 0 H5" stroke="#e0364f" stroke-width="3.4" stroke-linecap="round"/></g>
      <!-- bandaged heart -->
      <g class="hbeat"><g transform="translate(120 206)">
        <path d="M0 -12 C-22 -34 -52 -6 0 32 C52 -6 22 -34 0 -12Z" fill="#ff4f7d" stroke="#3a2a2a" stroke-width="3" stroke-linejoin="round"/>
        <rect x="-16" y="-4" width="32" height="11" rx="5" transform="rotate(-28)" fill="#f5d3a8" stroke="#3a2a2a" stroke-width="2"/>
      </g></g>
    </svg>
  </div>

  <svg class="ecg" viewBox="0 0 300 64" aria-hidden="true"><path d="M0 34 H84 L96 34 L106 12 L118 56 L130 4 L142 48 L152 34 H300"/></svg>

  <div class="card">
    <div class="player">
      <button id="play" aria-label="Play my voice message">▶</button>
      <div class="wave" id="wave" aria-hidden="true"></div>
      <span class="time" id="time">0:34</span>
    </div>
    <audio id="a" src="voice3.mp3" preload="metadata" playsinline></audio>
  </div>

  <svg class="union" viewBox="0 0 150 52" aria-hidden="true">
    <circle class="uglow" cx="75" cy="26" r="22" fill="var(--rose)"/>
    <g transform="translate(75 24)">
      <g class="u1"><path d="M0 -6 C-14 -22 -34 -4 0 18 C34 -4 14 -22 0 -6Z" fill="var(--rose)"/></g>
      <g class="u2"><path d="M0 -6 C-14 -22 -34 -4 0 18 C34 -4 14 -22 0 -6Z" fill="var(--card)" stroke="var(--rose)" stroke-width="2.5" stroke-linejoin="round"/></g>
    </g>
  </svg>

  <p class="line">I don't want to lose you. 🤍</p>

  <div class="choices" id="choices">
    <a class="talk" href="https://www.instagram.com/immilan.__/" target="_blank" rel="noopener">Let's talk 💗</a>
    <button class="later" id="later" type="button">I need more time</button>
  </div>
  <p class="okay" id="okay" hidden>Okay. Take your time. 🤍</p>
</main>

<script>
const $=id=>document.getElementById(id);
const a=$('a'), play=$('play'), wave=$('wave');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* waveform bars */
const N=34, heights=[]; for(let i=0;i<N;i++){ const h=18+Math.abs(Math.sin(i*.7)*18)+Math.abs(Math.sin(i*1.9))*14; heights.push(Math.min(44,h)); }
heights.forEach((h,i)=>{ const b=document.createElement('i'); b.style.height=h+'px'; b.style.animationDelay=(i%7)*.09+'s'; wave.appendChild(b); });
const bars=[...wave.children];
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function paint(){ const p=a.duration?a.currentTime/a.duration:0; bars.forEach((b,i)=>b.classList.toggle('done',i/N<p)); $('time').textContent=fmt(a.paused&&!a.currentTime?(a.duration||34):a.currentTime); }
a.addEventListener('loadedmetadata',paint);
a.addEventListener('timeupdate',paint);
a.addEventListener('ended',()=>{ play.textContent='▶'; play.classList.remove('on'); wave.classList.remove('live'); a.currentTime=0; paint(); });
play.onclick=()=>{
  if(a.paused){ a.play().then(()=>{ play.textContent='❚❚'; play.classList.add('on'); if(!reduce) wave.classList.add('live'); }).catch(()=>{}); }
  else { a.pause(); play.textContent='▶'; play.classList.remove('on'); wave.classList.remove('live'); }
};
wave.onclick=e=>{ if(!a.duration) return; const r=wave.getBoundingClientRect(); a.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*a.duration; paint(); };

/* "I need more time" : a gentle answer, no pressure */
$('later').onclick=()=>{ $('choices').hidden=true; $('okay').hidden=false; };

/* floating hearts */
if(!reduce) setInterval(()=>{
  const h=document.createElement('div'); h.className='fl'; h.textContent=['💗','🤍','💕','✨'][Math.random()*4|0];
  h.style.left=Math.random()*100+'vw'; h.style.fontSize=(12+Math.random()*16)+'px'; h.style.animationDuration=(7+Math.random()*5)+'s';
  document.body.appendChild(h); setTimeout(()=>h.remove(),12500);
},900);
if(!reduce) setInterval(()=>{ const p=document.createElement('div'); p.className='pt'; p.textContent='🌸'; p.style.left=Math.random()*100+'vw'; p.style.fontSize=(10+Math.random()*10)+'px'; p.style.animationDuration=(8+Math.random()*6)+'s'; document.body.appendChild(p); setTimeout(()=>p.remove(),15000); },1400);
</script>
</body>
</html>
